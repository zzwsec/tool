bind 127.0.0.1:53
bind-tcp 127.0.0.1:53

server 1.1.1.1
server 8.8.8.8
server 9.9.9.9
server 2606:4700:4700::1111
server 2001:4860:4860::8888
server 2620:fe::fe

speed-check-mode tcp:443,ping,tcp:80
response-mode fastest-ip

cache-persist yes
cache-file /var/cache/smartdns.cache
cache-checkpoint-time 3600
cache-size 20480

dualstack-ip-selection no

rr-ttl-min 300
rr-ttl-max 1800
prefetch-domain yes
serve-expired no

log-level warn
audit-enable no
